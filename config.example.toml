# ~/.config/tesla/config.toml
# O install.sh gera este arquivo. Edite à mão para trocar de destino ou de modelo.

# Comando do destino (ver PROTOCOLO.md). Lista: executável seguido dos argumentos.
destino = [
  "~/.local/bin/tesla-destino-obsidian",
  "--quadro", "~/Obsidian/MeuVault/Quadro.md",
]

# Ou um GitHub Project: issues em --repo, adicionadas ao project número --projeto.
# destino = [
#   "~/.local/bin/tesla-destino-github",
#   "--repo", "seu-usuario/tarefas",
#   "--projeto", "8",
# ]

# Usado só pelo parser LLM (--parser llm). As variáveis TESLA_OLLAMA e
# TESLA_OLLAMA_MODELO têm precedência sobre estes valores.
[llm]
url = "http://localhost:11434"
modelo = "qwen3:8b"
